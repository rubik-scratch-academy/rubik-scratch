<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahmoud.games.com | Grandmaster Pro Chess</title>
    <style>
        :root {
            --light-square: #f0d9b5;
            --dark-square: #b58863;
            --panel-bg: rgba(30, 10, 25, 0.85);
            --accent-color: #f43f5e;
            --duo-green: #58cc02;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* خلفية متدرجة تحرك باستمرار بين الوردي والأحمر */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1vw;
            color: var(--text-color);
            background: linear-gradient(-45deg, #ec4899, #f43f5e, #be123c, #831843, #fb7185);
            background-size: 400% 400%;
            animation: pinkRedGradient 8s ease infinite;
            overflow-x: hidden;
        }

        @keyframes pinkRedGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* الشعار واللوجو الاحترافي */
        .brand-logo {
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            font-weight: 900;
            background: linear-gradient(90deg, #ffffff, #fbcfe8, #fda4af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(244, 63, 94, 0.6);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .auth-container {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: clamp(20px, 4vw, 40px);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            width: 90vw;
            max-width: 480px;
        }

        .auth-container h2 { color: #fda4af; margin: 15px 0 10px; font-size: clamp(1rem, 2vw, 1.4rem); }
        .auth-container p { color: #f1f5f9; font-size: clamp(0.75rem, 1.5vw, 0.9rem); margin-bottom: 20px; }
        .auth-container input {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid #f43f5e; background: rgba(15, 23, 42, 0.9);
            color: white; font-size: 14px; text-align: center; margin-bottom: 20px; outline: none;
        }

        .btn {
            background: linear-gradient(90deg, #f43f5e, #fb7185);
            color: white; border: none;
            padding: 10px 20px; border-radius: 8px; font-weight: bold;
            cursor: pointer; transition: all 0.2s; font-size: clamp(0.75rem, 1.2vw, 1rem);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4); }

        .btn-duo {
            background: var(--duo-green);
            box-shadow: 0 4px 0 #46a302;
            border-radius: 12px; color: white; font-weight: 800; border: none;
            padding: 10px 18px; cursor: pointer; transition: all 0.1s;
        }
        .btn-duo:active { transform: translateY(4px); box-shadow: 0 0 0 #46a302; }

        .game-layout {
            display: none; flex-direction: column; align-items: center;
            width: 100%; max-width: 1400px; gap: 15px;
        }

        .navbar {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15); padding: 10px 20px;
            border-radius: 14px; display: flex; justify-content: space-between;
            align-items: center; width: 100%; flex-wrap: wrap; gap: 10px;
        }

        .controls-bar {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); padding: 10px 15px;
            border-radius: 12px; display: flex; gap: 12px;
            align-items: center; justify-content: center; flex-wrap: wrap; width: 100%;
        }

        .color-picker-group { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .color-picker-group input[type="color"] {
            border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; background: none;
        }

        .main-content { display: flex; gap: 20px; width: 100%; justify-content: center; flex-wrap: wrap; }

        .board-wrapper {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            padding: 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        /* التوافق الكامل مع جميع أنواع وشاشات الأرض */
        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, min(8.5vw, 65px));
            grid-template-rows: repeat(8, min(8.5vw, 65px));
            border: 3px solid #0f172a; border-radius: 6px; overflow: hidden;
        }

        .square {
            position: relative; display: flex; justify-content: center; align-items: center;
            cursor: pointer; user-select: none; transition: background-color 0.2s;
        }

        .square.light { background-color: var(--light-square); }
        .square.dark { background-color: var(--dark-square); }
        .square.selected { background-color: #f1c40f !important; }

        .piece {
            position: relative; z-index: 2;
            font-size: min(6vw, 42px);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3); pointer-events: none;
        }

        .square.in-check {
            background-color: #ef4444 !important;
            animation: pulseCheck 1s infinite alternate;
        }

        @keyframes pulseCheck {
            from { box-shadow: inset 0 0 5px #7f1d1d; }
            to { box-shadow: inset 0 0 20px #dc2626; }
        }

        .square.possible::after {
            content: ''; position: absolute; width: 30%; height: 30%;
            background-color: rgba(34, 197, 94, 0.85); border-radius: 50%;
            z-index: 1; box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
        }

        .square.possible.capture::after {
            width: 100%; height: 100%; border-radius: 0;
            background-color: rgba(239, 68, 68, 0.15);
            border: 4px solid rgba(239, 68, 68, 0.85);
            box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.5); z-index: 1;
        }

        .sidebar {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
            padding: 15px; width: min(90vw, 320px); display: flex; flex-direction: column; gap: 12px;
        }

        .panel-box {
            background: rgba(15, 23, 42, 0.6); padding: 12px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
        }

        .panel-box h3 {
            font-size: 0.9rem; color: #fda4af; margin-bottom: 6px;
            border-bottom: 1px solid #334155; padding-bottom: 4px;
        }

        .moves-log {
            height: 140px; overflow-y: auto; font-family: monospace;
            font-size: 12px; color: #cbd5e1; display: flex; flex-direction: column; gap: 4px;
        }

        /* نافذة ألغاز شطرنج بأسلوب دولينجو Duolingo */
        .duo-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            z-index: 100; align-items: center; justify-content: center; padding: 15px;
        }

        .duo-card {
            background: #1e293b; border: 3px solid #334155; border-radius: 20px;
            width: 100%; max-width: 450px; padding: 20px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .duo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .duo-progress { height: 12px; background: #334155; border-radius: 10px; width: 70%; overflow: hidden; }
        .duo-progress-fill { height: 100%; width: 20%; background: var(--duo-green); transition: width 0.3s; }
    </style>
</head>
<body>

    <!-- صفحة الكلمة السرية واللوجو -->
    <div id="authGate" class="auth-container">
        <div class="brand-logo">♟️ Mahmoud.games.com</div>
        <h2>🔒 تسجيل الدخول للمنصة</h2>
        <p>أدخل كلمة المرور السرية للوصول:</p>
        <input type="password" id="passInput" placeholder="أدخل كلمة المرور السرية...">
        <br>
        <button class="btn" onclick="authenticate()">دخول المنصة</button>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="gameApp" class="game-layout">
        <div class="navbar">
            <div class="brand-logo">♟️ Mahmoud.games.com</div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-duo" onclick="openDuolingoPuzzles()">🎯 ألغاز الشطرنج (Duolingo)</button>
                <button class="btn" style="background: #ef4444;" onclick="resetBoard()">إعادة تشغيل اللعبة</button>
            </div>
        </div>

        <div class="controls-bar">
            <div class="color-picker-group">
                <label>المربعات الفاتحة:</label>
                <input type="color" id="lightColorPicker" value="#f0d9b5" onchange="updateBoardColors()">
            </div>
            <div class="color-picker-group">
                <label>المربعات الداكنة:</label>
                <input type="color" id="darkColorPicker" value="#b58863" onchange="updateBoardColors()">
            </div>
            <button class="btn" onclick="applyPreset('classic')">خشب كلاسيكي</button>
            <button class="btn" onclick="applyPreset('emerald')">زمردي</button>
            <button class="btn" onclick="applyPreset('cyber')">سايبر بنك</button>
        </div>

        <div class="main-content">
            <div class="board-wrapper">
                <div id="board" class="chess-board"></div>
            </div>

            <div class="sidebar">
                <div class="panel-box">
                    <h3>حالة اللعبة</h3>
                    <p id="turnStatus">الدور الحالي: <strong style="color: #38bdf8;">الأبيض</strong></p>
                </div>

                <div class="panel-box">
                    <h3>سجل النقلات</h3>
                    <div id="movesLog" class="moves-log"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- صفحة الألغاز بأسلوب دولينجو -->
    <div id="duoModal" class="duo-modal">
        <div class="duo-card">
            <div class="duo-header">
                <span style="color: var(--duo-green); font-weight: 900; font-size: 1.2rem;">🦉 Chess Duo</span>
                <div class="duo-progress"><div id="duoProgress" class="duo-progress-fill"></div></div>
                <button onclick="closeDuolingoPuzzles()" style="background:none; border:none; color:white; font-size: 20px; cursor:pointer;">✖</button>
            </div>
            <h3 id="puzzleTitle" style="color: #38bdf8; margin-bottom: 10px;">اللغز 1 من 5</h3>
            <p id="puzzleDesc" style="font-size: 14px; margin-bottom: 15px; color: #cbd5e1;">أوجد أفضل نقلة للفرق الأبيض لتحقيق كش مات بنقلة واحدة!</p>
            <div id="puzzleHint" style="background: rgba(88, 204, 2, 0.1); border: 1px dashed var(--duo-green); padding: 10px; border-radius: 10px; font-size: 13px; color: #a7f3d0; margin-bottom: 15px;">💡 التلميح: ابحث عن النقلة القاتلة للوزير!</div>
            <button id="puzzleBtn" class="btn-duo" style="width: 100%; font-size: 16px;" onclick="nextPuzzle()">إجابة اللغز / النقلة التالية ➔</button>
        </div>
    </div>

    <script>
        const SECRET_PASS = "6310894123456789987654321123456789987654321010203040506070809";

        function authenticate() {
            const input = document.getElementById('passInput').value.trim();
            if (input === SECRET_PASS) {
                document.getElementById('authGate').style.display = 'none';
                document.getElementById('gameApp').style.display = 'flex';
                resetBoard();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function updateBoardColors() {
            const light = document.getElementById('lightColorPicker').value;
            const dark = document.getElementById('darkColorPicker').value;
            document.documentElement.style.setProperty('--light-square', light);
            document.documentElement.style.setProperty('--dark-square', dark);
        }

        function applyPreset(theme) {
            if (theme === 'classic') setColors('#f0d9b5', '#b58863');
            if (theme === 'emerald') setColors('#e2e8f0', '#059669');
            if (theme === 'cyber') setColors('#38bdf8', '#818cf8');
        }

        function setColors(light, dark) {
            document.getElementById('lightColorPicker').value = light;
            document.getElementById('darkColorPicker').value = dark;
            updateBoardColors();
        }

        // الألغاز المخصصة بنفس نمط دولينجو
        const duoPuzzles = [
            { title: "اللغز 1: كش مات نابليون", desc: "الأبيض يلعب وينتهي بالقتال السريع! ما هي النقلة؟", hint: "الوزير يهاجم المربع f7 بدعم من الفيل!" },
            { title: "اللغز 2: التضحية بالوزير (Smothered Mate)", desc: "الملك الأسود محاصر بقطعه. كيف تنفذ كش مات بالحصان؟", hint: "اقفز بالحصان إلى المربع f7!" },
            { title: "اللغز 3: الممر الأخير (Back Rank Mate)", desc: "الرخ الأسود ضعيف في الصف الأخير. أين تحرك القلعة؟", hint: "أنزل بالرخ إلى الصف الثامن مباشرة!" },
            { title: "اللغز 4: شوكة الحصان الملكية (Royal Fork)", desc: "كيف تهاجم الملك والوزير معاً بنفس الوقت؟", hint: "احرّك الحصان لمربع c7 لتضرب القطعتين!" },
            { title: "اللغز 5: التضحية الذهبية للفيل", desc: "اكسر دفاعات ملك الخصم بتضحية فيل قوية!", hint: "اضرب البيدق الموجود في h7 بالفيل مباشرة!" }
        ];
        let currentPuzzleIdx = 0;

        function openDuolingoPuzzles() {
            document.getElementById('duoModal').style.display = 'flex';
            loadPuzzle(0);
        }

        function closeDuolingoPuzzles() {
            document.getElementById('duoModal').style.display = 'none';
        }

        function loadPuzzle(idx) {
            currentPuzzleIdx = idx;
            const p = duoPuzzles[idx];
            document.getElementById('puzzleTitle').textContent = p.title;
            document.getElementById('puzzleDesc').textContent = p.desc;
            document.getElementById('puzzleHint').textContent = "💡 التلميح: " + p.hint;
            document.getElementById('duoProgress').style.width = ((idx + 1) * 20) + '%';
        }

        function nextPuzzle() {
            if (currentPuzzleIdx < duoPuzzles.length - 1) {
                loadPuzzle(currentPuzzleIdx + 1);
            } else {
                alert("🎉 رائع جداً! أكملت جميع الألغاز بنجاح وحصلت على وسام Duolingo Grandmaster!");
                closeDuolingoPuzzles();
            }
        }

        const pieceSymbols = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♜', 'N': '♞', 'B': '♝', 'Q': '♛', 'K': '♚', 'P': '♟'
        };

        const defaultBoard = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        let boardState = [];
        let selected = null; 
        let legalMoves = []; 
        let turn = 'W'; 

        function isWhite(p) { return p && p === p.toUpperCase(); }
        function isBlack(p) { return p && p === p.toLowerCase(); }

        function resetBoard() {
            boardState = defaultBoard.map(row => [...row]);
            turn = 'W'; selected = null; legalMoves = [];
            document.getElementById('movesLog').innerHTML = '';
            renderBoard(); updateGameStatus();
        }

        function isSquareAttacked(tr, tc, attackerColor, board) {
            const isAttackerWhite = (attackerColor === 'W');
            const pawnDir = isAttackerWhite ? 1 : -1;
            const pawnChar = isAttackerWhite ? 'P' : 'p';
            for (let dc of [-1, 1]) {
                let pr = tr + pawnDir, pc = tc + dc;
                if (pr >= 0 && pr <= 7 && pc >= 0 && pc <= 7) {
                    if (board[pr][pc] === pawnChar) return true;
                }
            }

            const knightChar = isAttackerWhite ? 'N' : 'n';
            const knightOffsets = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
            for (let [dr, dc] of knightOffsets) {
                let kr = tr + dr, kc = tc + dc;
                if (kr >= 0 && kr <= 7 && kc >= 0 && kc <= 7) {
                    if (board[kr][kc] === knightChar) return true;
                }
            }

            const kingChar = isAttackerWhite ? 'K' : 'k';
            for (let dr of [-1,0,1]) {
                for (let dc of [-1,0,1]) {
                    if (dr === 0 && dc === 0) continue;
                    let kr = tr + dr, kc = tc + dc;
                    if (kr >= 0 && kr <= 7 && kc >= 0 && kc <= 7) {
                        if (board[kr][kc] === kingChar) return true;
                    }
                }
            }

            const straightDirs = [[-1,0],[1,0],[0,-1],[0,1]];
            const rookChar = isAttackerWhite ? 'R' : 'r';
            const queenChar = isAttackerWhite ? 'Q' : 'q';
            for (let [dr, dc] of straightDirs) {
                let r = tr + dr, c = tc + dc;
                while (r >= 0 && r <= 7 && c >= 0 && c <= 7) {
                    const p = board[r][c];
                    if (p) {
                        if (p === rookChar || p === queenChar) return true;
                        break;
                    }
                    r += dr; c += dc;
                }
            }

            const diagDirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
            const bishopChar = isAttackerWhite ? 'B' : 'b';
            for (let [dr, dc] of diagDirs) {
                let r = tr + dr, c = tc + dc;
                while (r >= 0 && r <= 7 && c >= 0 && c <= 7) {
                    const p = board[r][c];
                    if (p) {
                        if (p === bishopChar || p === queenChar) return true;
                        break;
                    }
                    r += dr; c += dc;
                }
            }

            return false;
        }

        function findKing(color, board) {
            const target = color === 'W' ? 'K' : 'k';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c] === target) return { r, c };
                }
            }
            return null;
        }

        function isKingInCheck(color, board) {
            const kingPos = findKing(color, board);
            if (!kingPos) return false;
            const enemyColor = color === 'W' ? 'B' : 'W';
            return isSquareAttacked(kingPos.r, kingPos.c, enemyColor, board);
        }

        function getRawMoves(r, c, board) {
            const piece = board[r][c];
            if (!piece) return [];
            const white = isWhite(piece);
            const type = piece.toLowerCase();
            const moves = [];

            function addMove(tr, tc) {
                if (tr < 0 || tr > 7 || tc < 0 || tc > 7) return false;
                const target = board[tr][tc];
                if (!target) {
                    moves.push({ r: tr, c: tc, isCapture: false });
                    return true;
                }
                if ((white && isBlack(target)) || (!white && isWhite(target))) {
                    moves.push({ r: tr, c: tc, isCapture: true });
                }
                return false;
            }

            if (type === 'p') {
                const dir = white ? -1 : 1;
                const startRow = white ? 6 : 1;
                if (r + dir >= 0 && r + dir <= 7 && !board[r + dir][c]) {
                    moves.push({ r: r + dir, c: c, isCapture: false });
                    if (r === startRow && !board[r + 2 * dir][c]) {
                        moves.push({ r: r + 2 * dir, c: c, isCapture: false });
                    }
                }
                for (let dc of [-1, 1]) {
                    let tc = c + dc, tr = r + dir;
                    if (tr >= 0 && tr <= 7 && tc >= 0 && tc <= 7) {
                        let target = board[tr][tc];
                        if (target && ((white && isBlack(target)) || (!white && isWhite(target)))) {
                            moves.push({ r: tr, c: tc, isCapture: true });
                        }
                    }
                }
            } else if (type === 'n') {
                const offsets = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
                for (let [dr, dc] of offsets) addMove(r + dr, c + dc);
            } else if (type === 'r' || type === 'b' || type === 'q') {
                const dirs = [];
                if (type === 'r' || type === 'q') dirs.push([-1,0], [1,0], [0,-1], [0,1]);
                if (type === 'b' || type === 'q') dirs.push([-1,-1], [-1,1], [1,-1], [1,1]);

                for (let [dr, dc] of dirs) {
                    let tr = r + dr, tc = c + dc;
                    while (tr >= 0 && tr <= 7 && tc >= 0 && tc <= 7) {
                        if (!addMove(tr, tc)) break;
                        tr += dr; tc += dc;
                    }
                }
            } else if (type === 'k') {
                for (let dr of [-1, 0, 1]) {
                    for (let dc of [-1, 0, 1]) {
                        if (dr !== 0 || dc !== 0) addMove(r + dr, c + dc);
                    }
                }
            }
            return moves;
        }

        function getLegalMoves(r, c) {
            const piece = boardState[r][c];
            if (!piece) return [];
            const pieceColor = isWhite(piece) ? 'W' : 'B';
            if (pieceColor !== turn) return [];

            const rawMoves = getRawMoves(r, c, boardState);
            const verifiedLegalMoves = [];

            for (let move of rawMoves) {
                const simBoard = boardState.map(row => [...row]);
                simBoard[move.r][move.c] = simBoard[r][c];
                simBoard[r][c] = '';

                if (!isKingInCheck(pieceColor, simBoard)) {
                    verifiedLegalMoves.push(move);
                }
            }
            return verifiedLegalMoves;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            const inCheck = isKingInCheck(turn, boardState);
            const kingPos = findKing(turn, boardState);

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');

                    if (inCheck && kingPos && kingPos.r === r && kingPos.c === c) {
                        square.classList.add('in-check');
                    }

                    if (selected && selected.r === r && selected.c === c) {
                        square.classList.add('selected');
                    }

                    const moveOption = legalMoves.find(m => m.r === r && m.c === c);
                    if (moveOption) {
                        square.classList.add('possible');
                        if (moveOption.isCapture) square.classList.add('capture');
                    }

                    const piece = boardState[r][c];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = 'piece';
                        pieceSpan.textContent = pieceSymbols[piece];
                        pieceSpan.style.color = (piece === piece.toUpperCase()) ? '#ffffff' : '#0f172a';
                        square.appendChild(pieceSpan);
                    }

                    square.onclick = () => handleSquareClick(r, c);
                    boardEl.appendChild(square);
                }
            }
        }

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            const isWhitePiece = clickedPiece && isWhite(clickedPiece);
            const isBlackPiece = clickedPiece && isBlack(clickedPiece);

            if (!selected) {
                if (!clickedPiece) return;
                if ((turn === 'W' && isWhitePiece) || (turn === 'B' && isBlackPiece)) {
                    selected = { r, c };
                    legalMoves = getLegalMoves(r, c);
                    renderBoard();
                } else {
                    alert(turn === 'W' ? "الدور حالياً للاعب الأبيض!" : "الدور حالياً للاعب الأسود!");
                }
                return;
            }

            if (selected.r === r && selected.c === c) {
                selected = null; legalMoves = []; renderBoard(); return;
            }

            const validMove = legalMoves.find(m => m.r === r && m.c === c);
            if (validMove) {
                executeMove(selected.r, selected.c, r, c);
                selected = null; legalMoves = []; return;
            }

            if (clickedPiece && ((turn === 'W' && isWhitePiece) || (turn === 'B' && isBlackPiece))) {
                selected = { r, c }; legalMoves = getLegalMoves(r, c); renderBoard();
            } else {
                selected = null; legalMoves = []; renderBoard();
            }
        }

        function executeMove(fromR, fromC, toR, toC) {
            let piece = boardState[fromR][fromC];
            if (piece === 'P' && toR === 0) piece = 'Q';
            if (piece === 'p' && toR === 7) piece = 'q';

            boardState[toR][toC] = piece;
            boardState[fromR][fromC] = '';

            const cols = ['a','b','c','d','e','f','g','h'];
            const logEl = document.getElementById('movesLog');
            const moveText = `• ${piece.toUpperCase()} من (${cols[fromC]}${8-fromR}) إلى (${cols[toC]}${8-toR})`;
            logEl.innerHTML += `<div>${moveText}</div>`;
            logEl.scrollTop = logEl.scrollHeight;

            turn = turn === 'W' ? 'B' : 'W';
            renderBoard();
            updateGameStatus();
        }

        function updateGameStatus() {
            const el = document.getElementById('turnStatus');
            const turnName = turn === 'W' ? 'الأبيض' : 'الأسود';
            const turnColorHex = turn === 'W' ? '#38bdf8' : '#f43f5e';
            const inCheck = isKingInCheck(turn, boardState);

            if (inCheck) {
                el.innerHTML = `الدور الحالي: <strong style="color: ${turnColorHex};">${turnName}</strong> <span style="color: #ef4444; font-weight: bold;">⚠️ (كش ملك!)</span>`;
            } else {
                el.innerHTML = `الدور الحالي: <strong style="color: ${turnColorHex};">${turnName}</strong>`;
            }
        }
    </script>
</body>
</html>
