<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Pro Chess Platform</title>
    <style>
        :root {
            --light-square: #f0d9b5;
            --dark-square: #b58863;
            --panel-bg: rgba(30, 41, 59, 0.9);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* خلفية ديناميكية متحركة */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-color);
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #022c22, #172554);
            background-size: 400% 400%;
            animation: dynamicBackground 12s ease infinite;
            overflow-x: hidden;
        }

        @keyframes dynamicBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* بوابة الحماية */
        .auth-container {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .auth-container h2 {
            color: var(--accent-color);
            margin-bottom: 12px;
        }

        .auth-container p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .auth-container input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: white;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }

        /* واجهة اللعبة */
        .game-layout {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            gap: 20px;
        }

        .controls-bar {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .color-picker-group input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .main-content {
            display: flex;
            gap: 25px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .board-wrapper {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 65px);
            grid-template-rows: repeat(8, 65px);
            border: 4px solid #0f172a;
            border-radius: 6px;
            overflow: hidden;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .square.light { background-color: var(--light-square); }
        .square.dark { background-color: var(--dark-square); }
        .square.selected {
            background-color: #f1c40f !important;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .sidebar {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-box {
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .panel-box h3 {
            font-size: 1rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
        }

        .moves-log {
            height: 180px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        @media (max-width: 650px) {
            .chess-board {
                grid-template-columns: repeat(8, 42px);
                grid-template-rows: repeat(8, 42px);
            }
            .square { font-size: 28px; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- بوابة الحماية -->
    <div id="authGate" class="auth-container">
        <h2>🔒 تسجيل الدخول للمنصة</h2>
        <p>أدخل كلمة المرور السرية للوصول:</p>
        <input type="password" id="passInput" placeholder="أدخل كلمة المرور السرية...">
        <br>
        <button class="btn" onclick="authenticate()">دخول المنصة</button>
    </div>

    <!-- واجهة اللعبة -->
    <div id="gameApp" class="game-layout">
        
        <!-- التحكم بالألوان -->
        <div class="controls-bar">
            <div class="color-picker-group">
                <label>المربعات الفاتحة:</label>
                <input type="color" id="lightColorPicker" value="#f0d9b5" onchange="updateBoardColors()">
            </div>
            <div class="color-picker-group">
                <label>المربعات الداكنة:</label>
                <input type="color" id="darkColorPicker" value="#b58863" onchange="updateBoardColors()">
            </div>
            <button class="btn" onclick="applyPreset('classic')">خشب كلاسيكي</button>
            <button class="btn" onclick="applyPreset('emerald')">زمردي</button>
            <button class="btn" onclick="applyPreset('cyber')">سايبر بنك</button>
        </div>

        <div class="main-content">
            <!-- الرقعة -->
            <div class="board-wrapper">
                <div id="board" class="chess-board"></div>
            </div>

            <!-- معلومات الجولة -->
            <div class="sidebar">
                <div class="panel-box">
                    <h3>حالة اللعبة</h3>
                    <p id="turnStatus">الدور الحالي: <strong style="color: #38bdf8;">الأبيض</strong></p>
                </div>

                <div class="panel-box">
                    <h3>سجل النقلات</h3>
                    <div id="movesLog" class="moves-log"></div>
                </div>

                <button class="btn" style="background: #ef4444; color: white;" onclick="resetBoard()">إعادة تشغيل اللعبة</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_PASS = "6310894123456789987654321123456789987654321010203040506070809";

        function authenticate() {
            const input = document.getElementById('passInput').value.trim();
            if (input === SECRET_PASS) {
                document.getElementById('authGate').style.display = 'none';
                document.getElementById('gameApp').style.display = 'flex';
                resetBoard();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function updateBoardColors() {
            const light = document.getElementById('lightColorPicker').value;
            const dark = document.getElementById('darkColorPicker').value;
            document.documentElement.style.setProperty('--light-square', light);
            document.documentElement.style.setProperty('--dark-square', dark);
        }

        function applyPreset(theme) {
            if (theme === 'classic') setColors('#f0d9b5', '#b58863');
            if (theme === 'emerald') setColors('#e2e8f0', '#059669');
            if (theme === 'cyber') setColors('#38bdf8', '#818cf8');
        }

        function setColors(light, dark) {
            document.getElementById('lightColorPicker').value = light;
            document.getElementById('darkColorPicker').value = dark;
            updateBoardColors();
        }

        // استخدام رموز صلبة ومواضحة بصرياً لكل الألوان
        const pieceSymbols = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♜', 'N': '♞', 'B': '♝', 'Q': '♛', 'K': '♚', 'P': '♟'
        };

        const defaultBoard = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        let boardState = [];
        let selected = null; // { r, c }
        let turn = 'W'; // 'W' أو 'B'

        function resetBoard() {
            boardState = defaultBoard.map(row => [...row]);
            turn = 'W';
            selected = null;
            document.getElementById('movesLog').innerHTML = '';
            updateTurnStatus();
            renderBoard();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
                    
                    if (selected && selected.r === r && selected.c === c) {
                        square.classList.add('selected');
                    }

                    const piece = boardState[r][c];
                    if (piece) {
                        square.textContent = pieceSymbols[piece];
                        // القطع البيضاء نصها أبيض ناصع، والقطع السوداء نصها كحلي غامق واضح
                        square.style.color = (piece === piece.toUpperCase()) ? '#ffffff' : '#1e293b';
                    }

                    square.onclick = () => handleSquareClick(r, c);
                    boardEl.appendChild(square);
                }
            }
        }

        function handleSquareClick(r, c) {
            const clickedPiece = boardState[r][c];
            const isWhitePiece = clickedPiece && clickedPiece === clickedPiece.toUpperCase();
            const isBlackPiece = clickedPiece && clickedPiece === clickedPiece.toLowerCase();

            // 1. إذا لم تكن هناك قطعة محددة بعد
            if (!selected) {
                if (!clickedPiece) return;

                // التأكد من أن الدور للاعب صاحب القطعة
                if ((turn === 'W' && isWhitePiece) || (turn === 'B' && isBlackPiece)) {
                    selected = { r, c };
                    renderBoard();
                } else {
                    alert(turn === 'W' ? "الدور حالياً للاعب الأبيض!" : "الدور حالياً للاعب الأسود!");
                }
                return;
            }

            // 2. إذا تم النقر على نفس القطعة المحددة مجدداً -> إلغاء التحديد
            if (selected.r === r && selected.c === c) {
                selected = null;
                renderBoard();
                return;
            }

            // 3. إذا تم النقر على قطعة أخرى من نفس لونك -> تبديل التحديد إليها فوراً
            if (clickedPiece && ((turn === 'W' && isWhitePiece) || (turn === 'B' && isBlackPiece))) {
                selected = { r, c };
                renderBoard();
                return;
            }

            // 4. تنفيذ الحركة إلى المربع الهدف
            executeMove(selected.r, selected.c, r, c);
            selected = null;
            renderBoard();
        }

        function executeMove(fromR, fromC, toR, toC) {
            const piece = boardState[fromR][fromC];
            boardState[toR][toC] = piece;
            boardState[fromR][fromC] = '';

            // تسجل النقلة في اللوحة الجانبية
            const cols = ['a','b','c','d','e','f','g','h'];
            const logEl = document.getElementById('movesLog');
            const moveText = `• ${piece.toUpperCase()} من (${cols[fromC]}${8-fromR}) إلى (${cols[toC]}${8-toR})`;
            logEl.innerHTML += `<div>${moveText}</div>`;
            logEl.scrollTop = logEl.scrollHeight;

            // تبديل الدور
            turn = turn === 'W' ? 'B' : 'W';
            updateTurnStatus();
        }

        function updateTurnStatus() {
            const el = document.getElementById('turnStatus');
            el.innerHTML = `الدور الحالي: <strong style="color: ${turn === 'W' ? '#38bdf8' : '#f43f5e'};">${turn === 'W' ? 'الأبيض' : 'الأسود'}</strong>`;
        }
    </script>
</body>
</html>
