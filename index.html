<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Party Hub | 500-in-1</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent: #66fcf1;
            --accent-hover: #45a29e;
            --text: #c5c6c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-color); color: var(--text); overflow-x: hidden; }

        /* شريط العنوان والخيارات */
        header { background: #1f2833; padding: 20px; text-align: center; border-bottom: 2px solid var(--accent); box-shadow: 0 0 15px rgba(102, 252, 241, 0.2); }
        h1 { color: #fff; font-size: 2rem; margin-bottom: 10px; text-shadow: 0 0 8px var(--accent); }
        
        .setup-bar { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 15px; }
        select { padding: 8px 15px; font-size: 1rem; border-radius: 6px; background: #0b0c10; color: var(--accent); border: 1px solid var(--accent); outline: none; cursor: pointer; }

        /* قائمة الألعاب */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 30px; max-width: 1200px; margin: 0 auto; }
        
        .game-card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid rgba(102, 252, 241, 0.1); cursor: pointer; transition: all 0.3s ease; text-align: center; position: relative; overflow: hidden; }
        .game-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 5px 20px rgba(102, 252, 241, 0.3); }
        .game-card h3 { color: #fff; margin-bottom: 10px; }
        .game-card .tag { display: inline-block; padding: 4px 10px; background: rgba(102, 252, 241, 0.1); color: var(--accent); border-radius: 20px; font-size: 0.8rem; margin-top: 10px; }

        /* نافذة الشرح والتوجيه (Tutorial Modal) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal { background: #1f2833; width: 90%; max-width: 500px; border-radius: 15px; border: 2px solid var(--accent); padding: 25px; text-align: center; box-shadow: 0 0 25px rgba(102, 252, 241, 0.4); }
        .modal h2 { color: #fff; margin-bottom: 15px; }
        .modal p { color: #c5c6c7; line-height: 1.6; margin-bottom: 20px; }
        
        /* شاشة المحاكاة الكرتونية المتحركة للتحكم */
        .demo-box { width: 100%; height: 120px; background: #0b0c10; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .demo-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); position: absolute; animation: pulse 1.5s infinite alternate; }
        
        @keyframes pulse {
            0% { transform: scale(1) translateX(-50px); box-shadow: 0 0 5px var(--accent); }
            100% { transform: scale(1.2) translateX(50px); box-shadow: 0 0 20px var(--accent); }
        }

        .btn-start { padding: 12px 30px; font-size: 1.1rem; background: var(--accent); color: #0b0c10; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-start:hover { background: var(--accent-hover); transform: scale(1.05); }
        .btn-close { background: transparent; border: none; color: #ff4757; font-size: 1.5rem; float: left; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Cyber Party Games Hub</h1>
        <div class="setup-bar">
            <label>اختر عدد اللاعبين:</label>
            <select id="playerSelect">
                <option value="1">1 لاعب (ضد الكمبيوتر)</option>
                <option value="2" selected>2 لاعبين</option>
                <option value="4">4 لاعبين</option>
                <option value="6">6 لاعبين</option>
                <option value="8">8 لاعبين</option>
                <option value="10">10 لاعبين</option>
            </select>
        </div>
    </header>

    <main class="games-grid">
        <!-- لعبة الذكاء: الشطرنج السريع -->
        <div class="game-card" onclick="openTutorial('Chess Tactics', 'لعبة ذكاء وتكتيك! حرك قطعك للسيطرة على الرقعة والقضاء على ملك الخصم في جولات سريعة.', 'game_chess.html')">
            <h3>♟️ الشطرنج التكتيكي</h3>
            <p>لعبة ذكاء واستراتيجية</p>
            <span class="tag">ذكاء واستراتيجية</span>
        </div>

        <!-- لعبة السومو الاحترافية -->
        <div class="game-card" onclick="openTutorial('Neon Sumo', 'اضغط على زرك في الوقت المناسب للاندفاع نحو الخصوم ودفعهم لخارج الحلبة الدائرية.', 'game1.html')">
            <h3>🔴 حلبة السومو النيون</h3>
            <p>تدافع وفيزياء حركة</p>
            <span class="tag">قتال وتدافع</span>
        </div>

        <!-- لعبة المحتال -->
        <div class="game-card" onclick="openTutorial('Impostor Party', 'انقر على زرك بظرف سرّي لمعرفة دورك. حاول كشف المحتال قبل فوات الأوان!', 'game_impostor.html')">
            <h3>🤫 المحتال والمافيا</h3>
            <p>لعبة حفلات وغموض</p>
            <span class="tag">حفلات وغموض</span>
        </div>

        <!-- لعبة سباق السرعة -->
        <div class="game-card" onclick="openTutorial('Cyber Drift', 'اضغط باستمرار وبسرعة فائقة للتقدم بسيارتك وتجاوز خط النهاية أولاً.', 'game_race.html')">
            <h3>🏎️ سباق التفحيط السيبراني</h3>
            <p>سرعة رد فعل</p>
            <span class="tag">سباقات</span>
        </div>
    </main>

    <!-- نافذة الشرح قبل بدء اللعب -->
    <div class="modal-overlay" id="tutorialModal">
        <div class="modal">
            <button class="btn-close" onclick="closeTutorial()">✕</button>
            <h2 id="modalTitle">اسم اللعبة</h2>
            <div class="demo-box">
                <div class="demo-circle"></div>
            </div>
            <p id="modalDesc">طريقة اللعب والشرح هنا...</p>
            <button class="btn-start" onclick="startGame()">ابدأ اللعب الآن 🚀</button>
        </div>
    </div>

    <script>
        let selectedGameUrl = '';

        function openTutorial(title, description, url) {
            const players = document.getElementById('playerSelect').value;
            selectedGameUrl = `${url}?players=${players}`;
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = description;
            document.getElementById('tutorialModal').style.display = 'flex';
        }

        function closeTutorial() {
            document.getElementById('tutorialModal').style.display = 'none';
        }

        function startGame() {
            if (selectedGameUrl) {
                window.location.href = selectedGameUrl;
            }
        }
    </script>
</body>
</html>
