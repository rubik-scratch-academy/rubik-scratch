<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik & Scratch Academy | أكاديمية الروبيك وسكراتش</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #f97316;
            --accent: #06b6d4;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        /* Header / Navbar */
        header {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-icon-btn {
            position: relative;
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .cart-badge {
            background: var(--secondary);
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 0.75rem;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 40px 15px;
            background: radial-gradient(circle at center, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
        }

        .hero h1 {
            font-size: clamp(1.6rem, 5vw, 2.5rem);
            margin-bottom: 12px;
            color: #fff;
        }

        .hero p {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 20px;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Courses Grid */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .course-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .course-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .course-tag {
            align-self: flex-start;
            background: rgba(249, 115, 22, 0.15);
            color: var(--secondary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .course-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .course-details {
            list-style: none;
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 15px;
        }

        .course-details li {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .course-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background: var(--primary-dark);
        }

        /* Modal / Cart Drawer */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            border-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .close-modal {
            position: absolute;
            left: 20px;
            top: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 0.9rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .checkout-summary {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .summary-row.total {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
        }

        .terms-box {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            border: none;
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .whatsapp-btn.enabled {
            opacity: 1;
            pointer-events: auto;
        }

        .hidden {
            display: none;
        }

        /* Responsive Fixes */
        @media (max-width: 480px) {
            header {
                padding: 12px 15px;
            }
            .logo {
                font-size: 1.1rem;
            }
            .modal-content {
                padding: 15px;
            }
            .course-card {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">
                <i class="fa-solid fa-cube"></i> Rubik & Scratch
            </div>
            <button class="cart-icon-btn" onclick="openCart()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>السلة</span>
                <span class="cart-badge" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>أكاديمية الروبيك وسكراتش</h1>
            <p>منصتك الاحترافية لتعلم حل مكعبات الروبيك وبناء الألعاب والبرمجة بأسلوب تفاعلي وممتع</p>
        </div>
    </section>

    <main class="container">
        <div class="courses-grid" id="coursesGrid"></div>
    </main>

    <!-- Modal Cart & Order -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeCart()"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="margin-bottom: 15px;">إتمام الطلب والتسجيل</h3>

            <div id="cartItemsList" style="margin-bottom: 15px;"></div>

            <form id="orderForm" oninput="validateForm()">
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" id="custName" class="form-control" placeholder="أدخل اسمك" required>
                </div>

                <div class="form-group">
                    <label>الجنس:</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="gender" value="ولد" checked> ولد</label>
                        <label class="radio-label"><input type="radio" name="gender" value="بنت"> بنت</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>العمر:</label>
                    <input type="number" id="custAge" class="form-control" min="5" max="99" placeholder="مثال: 14" required>
                </div>

                <div class="form-group">
                    <label>نوع التدريب:</label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="type" value="أونلاين" checked onclick="toggleLocationField()"> أونلاين</label>
                        <label class="radio-label"><input type="radio" name="type" value="حضوري" onclick="toggleLocationField()"> حضوري (في الرياض)</label>
                    </div>
                </div>

                <div class="form-group hidden" id="locationGroup">
                    <label>الحي / العنوان في الرياض (للتدريب الحضوري):</label>
                    <input type="text" id="custLocation" class="form-control" placeholder="أدخل اسم الحي">
                </div>

                <div class="checkout-summary">
                    <div class="summary-row">
                        <span>المجموع الأساسي:</span>
                        <span id="subTotal">0 ريال</span>
                    </div>
                    <div class="summary-row" id="discountRow" style="color: var(--success); display: none;">
                        <span>خصم الباقة المفضلة:</span>
                        <span id="discountVal">0 ريال</span>
                    </div>
                    <div class="summary-row total">
                        <span>الإجمالي النهائـي:</span>
                        <span id="finalTotal">0 ريال</span>
                    </div>
                </div>

                <div class="terms-box">
                    <input type="checkbox" id="termsCheck" onclick="validateForm()">
                    <label for="termsCheck">أوافق على سياسة الدفع نقداً عند بدء الدورة، وأقر بصحة بيانات العمر والجنس المدخلة.</label>
                </div>

                <button type="button" class="whatsapp-btn" id="submitBtn" onclick="sendToWhatsApp()">
                    <i class="fa-brands fa-whatsapp" style="font-size: 1.3rem;"></i> تأكيد الطلب عبر الواتساب
                </button>
            </form>
        </div>
    </div>

    <script>
        const courses = [
            { id: 1, title: 'دورة مكعب الروبيك 3x3', tag: 'روبيك', duration: 'جلسات مكثفة', price: 100, icon: 'fa-cube' },
            { id: 2, title: 'دورة برمجة الألعاب (Scratch)', tag: 'برمجة', duration: 'مشروع كامل', price: 150, icon: 'fa-code' },
            { id: 3, title: 'الباقة الشاملة (روبيك + سكراتش)', tag: 'عرض خاص', duration: 'مسار كامل', price: 200, icon: 'fa-star' }
        ];

        let cart = [];

        function renderCourses() {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = courses.map(course => `
                <div class="course-card">
                    <div>
                        <span class="course-tag">${course.tag}</span>
                        <h3 class="course-title"><i class="fa-solid ${course.icon}"></i> ${course.title}</h3>
                        <ul class="course-details">
                            <li><i class="fa-regular fa-clock"></i> المدة: ${course.duration}</li>
                            <li><i class="fa-solid fa-check"></i> تطبيق عملي ومباشر</li>
                        </ul>
                    </div>
                    <div>
                        <div class="course-price">${course.price} ريال</div>
                        <button class="add-btn" onclick="addToCart(${course.id})">إضافة للسلة</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            if (!cart.includes(id)) {
                cart.push(id);
                updateCartUI();
            }
            openCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(itemId => itemId !== id);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const itemsList = document.getElementById('cartItemsList');
            
            if (cart.length === 0) {
                itemsList.innerHTML = '<p style="color: var(--text-muted); text-align: center;">السلة فارغة حالياً</p>';
                calculateTotal(0);
                return;
            }

            let subtotal = 0;
            itemsList.innerHTML = cart.map(id => {
                const item = courses.find(c => c.id === id);
                subtotal += item.price;
                return `
                    <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px;">
                        <span>${item.title}</span>
                        <div>
                            <span style="font-weight: bold; margin-left: 10px;">${item.price} ريال</span>
                            <button onclick="removeFromCart(${item.id})" style="background: none; border: none; color: var(--danger); cursor: pointer;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');

            calculateTotal(subtotal);
        }

        function calculateTotal(subtotal) {
            let discount = 0;
            // خصم عند اختيار دورتين منفصلتين معاً
            if (cart.includes(1) && cart.includes(2) && !cart.includes(3)) {
                discount = 50; // تحويل السعر إلى سعر الباقة الشاملة
            }

            const final = subtotal - discount;
            document.getElementById('subTotal').innerText = `${subtotal} ريال`;
            
            if (discount > 0) {
                document.getElementById('discountRow').style.display = 'flex';
                document.getElementById('discountVal').innerText = `-${discount} ريال`;
            } else {
                document.getElementById('discountRow').style.display = 'none';
            }

            document.getElementById('finalTotal').innerText = `${final} ريال`;
        }

        function toggleLocationField() {
            const isPhysical = document.querySelector('input[name="type"]:checked').value === 'حضوري';
            const locGroup = document.getElementById('locationGroup');
            if (isPhysical) {
                locGroup.classList.remove('hidden');
            } else {
                locGroup.classList.add('hidden');
            }
        }

        function validateForm() {
            const name = document.getElementById('custName').value.trim();
            const age = document.getElementById('custAge').value;
            const terms = document.getElementById('termsCheck').checked;
            const btn = document.getElementById('submitBtn');

            if (name !== '' && age > 0 && terms && cart.length > 0) {
                btn.classList.add('enabled');
            } else {
                btn.classList.remove('enabled');
            }
        }

        function openCart() {
            document.getElementById('cartModal').classList.add('active');
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('active');
        }

        function sendToWhatsApp() {
            const name = document.getElementById('custName').value.trim();
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const age = document.getElementById('custAge').value;
            const type = document.querySelector('input[name="type"]:checked').value;
            const location = document.getElementById('custLocation').value.trim();
            
            const selectedCourses = cart.map(id => courses.find(c => c.id === id).title).join(' + ');
            const total = document.getElementById('finalTotal').innerText;

            let msg = `مرحباً، أود التسجيل في الأكاديمية:\n\n`;
            msg += `👤 *الاسم:* ${name}\n`;
            msg += `⚧ *الجنس:* ${gender}\n`;
            msg += `🎂 *العمر:* ${age}\n`;
            msg += `📚 *الدورات:* ${selectedCourses}\n`;
            msg += `💻 *نوع التدريب:* ${type}\n`;
            if (type === 'حضوري' && location !== '') {
                msg += `📍 *العنوان:* ${location}\n`;
            }
            msg += `💰 *الإجمالي:* ${total}\n`;
            msg += `✅ متفق على الدفع نقداً عند بدء التدريب.`;

            const phone = "966569749374";
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // Initialize
        renderCourses();
    </script>
</body>
</html>
