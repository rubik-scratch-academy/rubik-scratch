<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahmoud.Games - AI Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- شاشة الشعار --- */
        #logo-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeOut 1s ease-in-out 2s forwards;
        }

        .logo-box {
            text-align: center;
            animation: zoomIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo-title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .logo-title span { color: #ef4444; }

        /* --- شاشة كلمة السر --- */
        #password-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 400px;
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            text-align: center;
        }

        .pass-input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: #38bdf8;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:active { transform: scale(0.95); }
        .error-msg { color: #ef4444; margin-top: 10px; display: none; }

        /* --- الواجهة الأساسية --- */
        #main-dashboard {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 600px;
        }

        .header-title { font-size: 2.2rem; margin-bottom: 25px; }
        .header-title span { color: #ef4444; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-height: 70vh;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .game-btn {
            background: #1e293b;
            border: none;
            border-radius: 16px;
            padding: 20px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #0f172a;
            min-height: 110px;
            transition: 0.1s;
        }

        .game-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f172a;
        }

        /* --- شاشة الذكاء الاصطناعي السري --- */
        #ai-screen {
            display: none;
            flex-direction: column;
            width: 90%;
            max-width: 600px;
            height: 85vh;
            background: #0f172a;
            border: 2px solid #38bdf8;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            overflow: hidden;
            position: relative;
        }

        .ai-header {
            background: #38bdf8;
            color: #0f172a;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ai-chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg { padding: 12px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .msg-ai { background: #1e293b; color: #38bdf8; align-self: flex-start; border-bottom-right-radius: 0; }
        .msg-user { background: #38bdf8; color: #0f172a; align-self: flex-end; border-bottom-left-radius: 0; }

        .ai-input-area {
            display: flex;
            padding: 15px;
            background: #1e293b;
        }

        .ai-input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: #0f172a;
            color: white;
            font-size: 1rem;
        }

        .ai-send {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            margin-right: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* شاشة معاينة اللعبة المصنوعة */
        .game-preview {
            display: none;
            margin-top: 10px;
            background: #000;
            border: 2px dashed #10b981;
            height: 150px;
            border-radius: 10px;
            align-items: center;
            justify-content: center;
            color: #10b981;
            font-size: 1.5rem;
            flex-direction: column;
        }

        .preview-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .btn-approve { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-edit { background: #f59e0b; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-close { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }

        @keyframes zoomIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeOut { 0% { opacity: 1; visibility: visible; } 100% { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body>

    <!-- شاشة الشعار -->
    <div id="logo-screen">
        <div class="logo-box">
            <div class="logo-title">Mahmoud.<span>Games</span></div>
        </div>
    </div>

    <!-- شاشة كلمة السر -->
    <div id="password-screen">
        <h2 style="color:white; margin-bottom:20px;">تسجيل الدخول للمنصة</h2>
        <input type="password" id="pass-input" class="pass-input" placeholder="أدخل الرمز...">
        <button class="btn-submit" onclick="checkPassword()">دخول</button>
        <p id="error-msg" class="error-msg">الرمز غير صحيح!</p>
    </div>

    <!-- الواجهة الأساسية -->
    <div id="main-dashboard">
        <h1 class="header-title">Mahmoud.<span>Games</span></h1>
        <div class="grid-container" id="games-grid">
            <button class="game-btn" style="background:#ef4444; box-shadow:0 6px 0 #991b1b;">1 PLAYER</button>
            <button class="game-btn" style="background:#3b82f6; box-shadow:0 6px 0 #1d4ed8;">2 PLAYERS</button>
            <button class="game-btn" style="background:#8b5cf6; box-shadow:0 6px 0 #6d28d9; grid-column:span 2;">🎉 PARTY GAMES</button>
        </div>
    </div>

    <!-- شاشة الذكاء الاصطناعي السرية -->
    <div id="ai-screen">
        <div class="ai-header">
            <span>🤖 مختبر الذكاء الاصطناعي (المطور المساعد)</span>
            <button class="btn-close" onclick="exitAI()">خروج</button>
        </div>
        
        <div class="ai-chat" id="chat-box">
            <div class="msg msg-ai">أهلاً بك يا سيدي المطور! أنا ذكاء اصطناعي مبرمج لخدمتك. ماذا تريدني أن أصنع لك اليوم؟</div>
            
            <!-- نافذة المعاينة المخفية -->
            <div id="game-preview-container" style="display: none; width: 100%; margin-top: 10px;">
                <div class="game-preview" id="game-preview-screen">
                    <span id="preview-icon">♟️</span>
                    <span id="preview-title">لعبة الشطرنج</span>
                </div>
                <div class="preview-btns">
                    <button class="btn-approve" onclick="approveGame()">✅ اعتمدها</button>
                    <button class="btn-edit" onclick="requestEdit()">✏️ عدّلها</button>
                </div>
            </div>
        </div>

        <div class="ai-input-area">
            <input type="text" id="ai-command" class="ai-input" placeholder="مثال: اصنع لي لعبة شطرنج احترافية...">
            <button class="ai-send" onclick="sendToAI()">إرسال</button>
        </div>
    </div>

    <script>
        let currentGameRequested = "";

        setTimeout(() => {
            document.getElementById('logo-screen').style.display = 'none';
            document.getElementById('password-screen').style.display = 'flex';
        }, 2200);

        function checkPassword() {
            const val = document.getElementById('pass-input').value;
            if (val === "323232") {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('main-dashboard').style.display = 'flex';
            } else if (val === "232323") {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('ai-screen').style.display = 'flex';
                document.getElementById('pass-input').value = ""; // تصفير الحقل
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function exitAI() {
            document.getElementById('ai-screen').style.display = 'none';
            document.getElementById('password-screen').style.display = 'flex';
        }

        function sendToAI() {
            const inputField = document.getElementById('ai-command');
            const chatBox = document.getElementById('chat-box');
            const previewContainer = document.getElementById('game-preview-container');
            const cmd = inputField.value.trim();

            if (!cmd) return;

            // رسالة المستخدم
            chatBox.innerHTML += `<div class="msg msg-user">${cmd}</div>`;
            inputField.value = "";
            previewContainer.style.display = 'none';

            // تحديد اسم اللعبة
            currentGameRequested = cmd.includes("شطرنج") ? "شطرنج احترافية" : 
                                   cmd.includes("سيارات") ? "سباق سيارات" : "لعبة جديدة";
            
            let icon = cmd.includes("شطرنج") ? "♟️" : cmd.includes("سيارات") ? "🏎️" : "🎮";

            // رد الذكاء الاصطناعي المؤقت
            setTimeout(() => {
                chatBox.innerHTML += `<div class="msg msg-ai">جاري تحليل طلبك وبرمجة الأكواد... ⚙️</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
                // إظهار اللعبة
                setTimeout(() => {
                    chatBox.innerHTML += `<div class="msg msg-ai">تم الانتهاء! تفضل بتجربة "${currentGameRequested}". هل أعتمدها أم تحتاج تعديل؟</div>`;
                    
                    document.getElementById('preview-title').innerText = currentGameRequested;
                    document.getElementById('preview-icon').innerText = icon;
                    
                    // نقل نافذة المعاينة للأسفل
                    chatBox.appendChild(previewContainer);
                    previewContainer.style.display = 'block';
                    document.getElementById('game-preview-screen').style.display = 'flex';
                    
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 1500);

            }, 500);
        }

        function requestEdit() {
            const chatBox = document.getElementById('chat-box');
            document.getElementById('game-preview-container').style.display = 'none';
            chatBox.innerHTML += `<div class="msg msg-user">قم بتعديلها وإضافة مؤثرات أفضل</div>`;
            setTimeout(() => {
                chatBox.innerHTML += `<div class="msg msg-ai">حاضر، تم تعديل الفيزياء والألوان. جربها الآن! يمكنك الاعتماد إذا أعجبتك.</div>`;
                chatBox.appendChild(document.getElementById('game-preview-container'));
                document.getElementById('game-preview-container').style.display = 'block';
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

        function approveGame() {
            // إخفاء نافذة المعاينة
            document.getElementById('game-preview-container').style.display = 'none';
            
            // رد الذكاء
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="msg msg-ai">تم اعتماد "${currentGameRequested}" وإضافتها بنجاح إلى الواجهة الأساسية! ✅</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // إضافة اللعبة برمجياً للوحة الرئيسية
            const grid = document.getElementById('games-grid');
            const newBtn = document.createElement('button');
            newBtn.className = 'game-btn';
            newBtn.style.background = '#10b981'; // لون أخضر للألعاب الجديدة
            newBtn.style.boxShadow = '0 6px 0 #047857';
            newBtn.innerHTML = `🎮 ${currentGameRequested}<br><small style="font-size:0.8rem; color:#d1fae5;">(مُضافة بواسطة AI)</small>`;
            grid.appendChild(newBtn);
        }

        // تفعيل زر Enter
        document.getElementById('pass-input').addEventListener('keypress', e => { if(e.key === 'Enter') checkPassword(); });
        document.getElementById('ai-command').addEventListener('keypress', e => { if(e.key === 'Enter') sendToAI(); });
    </script>
</body>
</html>
