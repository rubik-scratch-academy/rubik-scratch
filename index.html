<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>10 Players Mini Games</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif; }
        body { background: #12131C; color: #fff; overflow-x: hidden; text-align: center; }

        /* الشعار العلوي */
        .header { padding: 25px 15px 10px; }
        .logo { font-size: 2.8rem; font-weight: 900; background: linear-gradient(45deg, #FF4757, #FFA502, #2ED573, #1E90FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 4px 15px rgba(0,0,0,0.4); letter-spacing: 2px; }
        
        /* محدد عدد اللاعبين على نمط 1234 Player */
        .player-selector { display: flex; justify-content: center; gap: 8px; margin: 15px auto 25px; background: #1E202F; padding: 6px; border-radius: 50px; width: fit-content; border: 2px solid #2F3249; }
        .p-chip { width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; color: #A0A5C0; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        .p-chip.active { background: #FF4757; color: #fff; box-shadow: 0 0 12px #FF4757; transform: scale(1.1); }

        /* قائمة الألعاب ببطاقات دائرية كرتونية */
        .games-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 0 20px 40px; max-width: 800px; margin: 0 auto; }
        
        .game-btn { background: #1E202F; border-radius: 25px; padding: 15px; border: 3px solid #2F3249; cursor: pointer; transition: all 0.15s ease-in-out; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 0 #0E0F17; }
        .game-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #0E0F17; }
        
        /* أيقونات الألعاب الملونة */
        .icon-box { width: 70px; height: 70px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); }
        .game-btn h3 { font-size: 1.1rem; color: #FFF; font-weight: bold; }

        /* ألوان الأيقونات مثل ألعاب JindoBlu */
        .bg-red { background: #FF4757; }
        .bg-blue { background: #1E90FF; }
        .bg-green { background: #2ED573; }
        .bg-yellow { background: #FFA502; }
        .bg-purple { background: #9b59b6; }

        /* نافذة التعليمات والشرح (Popup Tutorial) */
        .modal-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-card { background: #1E202F; width: 85%; max-width: 380px; border-radius: 30px; border: 4px solid #2F3249; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        /* أنيميشن كرتوني يعرض طريقة الضغط */
        .tutorial-anim { width: 100%; height: 130px; background: #12131C; border-radius: 20px; margin: 15px 0; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; border: 2px dashed #2F3249; }
        .finger-touch { width: 45px; height: 45px; border-radius: 50%; background: #FF4757; animation: tapAnim 1.2s infinite ease-in-out; }
        
        @keyframes tapAnim {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 20px #FF4757; }
            100% { transform: scale(1); opacity: 0.3; }
        }

        .play-btn { width: 100%; padding: 15px; font-size: 1.3rem; font-weight: bold; border: none; border-radius: 50px; background: #2ED573; color: #fff; cursor: pointer; box-shadow: 0 6px 0 #218c4a; margin-top: 10px; }
        .play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #218c4a; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">1 2 3 4 5+</div>
        <p style="color: #A0A5C0; margin-top: 5px;">ألعاب الحفلات الجماعية</p>
    </div>

    <!-- اختيار عدد اللاعبين (شريط علوي دائري) -->
    <div class="player-selector">
        <button class="p-chip" onclick="setPlayers(2, this)">2</button>
        <button class="p-chip active" onclick="setPlayers(4, this)">4</button>
        <button class="p-chip" onclick="setPlayers(6, this)">6</button>
        <button class="p-chip" onclick="setPlayers(8, this)">8</button>
        <button class="p-chip" onclick="setPlayers(10, this)">10</button>
    </div>

    <!-- شبكة الألعاب على شكل زر كرتوني ضخم -->
    <div class="games-container">
        
        <!-- لعبة الشطرنج التكتيكي -->
        <div class="game-btn" onclick="showTutorial('الشطرنج السريع', 'لعبة ذكاء وتكتيك! اضغط للسيطرة على الرقعة وتدمير قطع الخصم.', 'game_chess.html')">
            <div class="icon-box bg-purple">♟️</div>
            <h3>الشطرنج</h3>
        </div>

        <!-- لعبة السومو -->
        <div class="game-btn" onclick="showTutorial('دفع السومو', 'اضغط على زر لونك بسرعة لدفع اللاعبين الآخرين وخروجهم خارج الدائرة!', 'game1.html')">
            <div class="icon-box bg-red">🤼</div>
            <h3>السومو</h3>
        </div>

        <!-- لعبة المحتال / المافيا -->
        <div class="game-btn" onclick="showTutorial('المحتال والمافيا', 'اضغط لرؤية دورك السرّي على الزر، ثم اصوت على المحتال في الحفلة!', 'game_impostor.html')">
            <div class="icon-box bg-blue">🕵️</div>
            <h3>المحتال</h3>
        </div>

        <!-- لعبة السباق -->
        <div class="game-btn" onclick="showTutorial('سباق السيارات', 'اضغط بسرعة وبشكل متكرر لتسريع سيارتك والوصول للنهاية أولاً!', 'game_race.html')">
            <div class="icon-box bg-yellow">🏎️</div>
            <h3>السباق</h3>
        </div>

        <!-- لعبة الدبابات -->
        <div class="game-btn" onclick="showTutorial('حرب الدبابات', 'وجه دباباتك واطلق القذائف لتدمير بقية اللاعبين في المتاهة.', 'game_tanks.html')">
            <div class="icon-box bg-green">💥</div>
            <h3>الدبابات</h3>
        </div>

    </div>

    <!-- النافذة التفاعلية قبل بدء اللعبة -->
    <div class="modal-bg" id="tutorialPopup">
        <div class="modal-card">
            <h2 id="tTitle" style="color: #fff; font-size: 1.6rem;">اسم اللعبة</h2>
            <div class="tutorial-anim">
                <div class="finger-touch"></div>
            </div>
            <p id="tDesc" style="color: #A0A5C0; font-size: 0.95rem; line-height: 1.4;"></p>
            <button class="play-btn" onclick="launchGame()">العب الآن 🎮</button>
        </div>
    </div>

    <script>
        let selectedPlayers = 4;
        let targetUrl = '';

        function setPlayers(num, btn) {
            selectedPlayers = num;
            document.querySelectorAll('.p-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function showTutorial(title, desc, url) {
            targetUrl = `${url}?p=${selectedPlayers}`;
            document.getElementById('tTitle').innerText = title;
            document.getElementById('tDesc').innerText = desc;
            document.getElementById('tutorialPopup').style.display = 'flex';
        }

        function launchGame() {
            if (targetUrl) {
                window.location.href = targetUrl;
            }
        }

        // إغلاق النافذة عند الضغط خارجها
        document.getElementById('tutorialPopup').addEventListener('click', function(e) {
            if (e.target === this) this.style.display = 'none';
        });
    </script>
</body>
</html>
